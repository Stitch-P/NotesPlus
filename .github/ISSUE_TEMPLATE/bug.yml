name: Bug report
description: Report a problem with Notes+.
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Notes+ version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the affected feature or tracker. Use a synthetic note or share code if needed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: You can attach a screenshot with player names and personal notes removed.
    validations:
      required: true
